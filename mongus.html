<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ícone de menu sanduíche para X</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #000;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Checkbox escondido (igual ao do tema) */
  #btn-menu {
    display: none;
  }

  /* Label que envolve o ícone */
  #nav-icon {
    display: block;
    cursor: pointer;
    height: 60px;
    line-height: 60px;
    padding: 13px 20px 0;
    transition: .4s;
  }

  /* Área do ícone */
  .circle {
    position: relative;
    width: 28px;
    height: 28px;
  }

  /* Linhas */
  .line {
    position: absolute;
    height: 3px;
    width: 100%;
    border-radius: 8px;
    background: #fff;
    transition: .15s;
  }

  .top    { top: 18%; }
  .middle { top: 48%; }
  .bottom { top: 78%; }

  /* Estado aberto: vira X */
  .nav-icon.close .top {
    transform: rotate(45deg);
    top: 48%;
  }

  .nav-icon.close .bottom,
  .nav-icon.close .middle {
    transform: rotate(-45deg);
    top: 48%;
  }
</style>
</head>
<body>

  <input type="checkbox" id="btn-menu" />

  <label id="nav-icon" for="btn-menu">
    <div class="circle nav-icon">
      <span class="line top"></span>
      <span class="line middle"></span>
      <span class="line bottom"></span>
    </div>
  </label>

  <script>
    const checkbox = document.getElementById('btn-menu');
    const icon = document.querySelector('.nav-icon');

    checkbox.addEventListener('change', function () {
      icon.classList.toggle('close', checkbox.checked);
    });
  </script>

</body>
</html>
