<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro 404</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@100&display=swap" rel="stylesheet">
    <style>
        html, body {
            background: #ea0;
            height: 100%;
            margin: 0;
            overflow: hidden;
            position: relative;
        }
        #can {
            height: 100%;
            min-height: 2000px;
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
        }
        #title {
            color: #ea0;
            font-family: 'Nunito', sans-serif;
            font-size: 20rem;
            font-weight: 100;
            height: 180px;
            line-height: 180px;
            margin: auto;
            pointer-events: none;
            position: absolute;
            text-align: center;
            text-shadow: none;
            transition: text-shadow 10s 3s;
            top: 0; 
            bottom: 0;
            left: 0;
            right: 0;
            user-select: none;
            width: 100%;
            z-index: 2;
        }
        #title.anim {
            text-shadow: 0 2px 3px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <canvas id="can"></canvas>
    <h1 id="title">404</h1>
    <script>
        var c = document.getElementById('can');
        var t = document.getElementById('title');
        setTimeout(function () {
            t.classList.add('anim');
        }, 500);
        var w = c.width = window.innerWidth,
            h = c.height = Math.max(2000, window.innerHeight),
            ctx = c.getContext('2d'),
            spawnProb = 1,
            linesPerIteration = 25,
            numberOfMoves = [80, 240],
            distance = [50, 2000],
            attenuator = 900,
            timeBetweenMoves = [3, 5],
            size = [.2, .5],
            lines = [],
            frame = (Math.random()*360)|0;
        function rand(ar){
            return Math.random() * (ar[1] - ar[0]) + ar[0];
        }
        function Line(){
            this.x = Math.random() * w;
            this.y = Math.random() * h;
            this.vx = this.vy = 0;
            this.last = {};
            this.target = {};
            this.totalMoves = rand(numberOfMoves);
            this.move = 0;
            this.timeBetweenMoves = rand(timeBetweenMoves);
            this.timeSpentThisMove = this.timeBetweenMoves;
            this.distance = rand(distance);
            this.color = 'hsl(hue, 80%, 100%)'.replace('hue', frame%360);
            this.size = rand(size);
        }
        Line.prototype.use = function(){
            ++this.timeSpentThisMove;
            if(this.timeSpentThisMove >= this.timeBetweenMoves){
                ++this.move;
                this.timeSpentThisMove = 0;
                var rad = Math.random() * 2 * Math.PI;
                this.target.x = this.x + Math.cos(rad) * this.distance;
                this.target.y = this.y + Math.sin(rad) * this.distance;
            }
            this.last.x = this.x;
            this.last.y = this.y;
            this.vx += (this.x - this.target.x)/attenuator;
            this.vy += (this.y - this.target.y)/attenuator;
            this.x += this.vx;
            this.y += this.vy;
            ctx.lineWidth = this.size;
            ctx.strokeStyle = ctx.shadowColor = this.color;
            ctx.beginPath();
            ctx.moveTo(this.last.x, this.last.y);
            ctx.lineTo(this.x, this.y);
            ctx.stroke();
        }
        function anim(){
            window.requestAnimationFrame(anim);
            ++frame;
            ctx.fillStyle = 'rgba(41, 152, 217, 0)';
            ctx.fillRect(0, 0, w, h);
            if(Math.random() < spawnProb)  
                for(var i = 0; i < linesPerIteration; i++)
                    lines.push(new Line);
            for(var i = 0; i < lines.length; ++i){
                lines[i].use();
                if(lines[i].move >= lines[i].totalMoves){
                    lines.splice(i, 1);
                    --i;
                }
            }
        }
        anim();
    </script>
</body>
</html>
